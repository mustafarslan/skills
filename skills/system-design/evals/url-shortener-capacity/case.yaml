schema_version: "1.1"
name: url-shortener-capacity
expected_outcome: |
  A design doc whose estimation quotes capacity_calc.py output (about 39 writes/s and about 3,900
  reads/s on average before the peak multiplier, roughly 3 TB logical storage over 5 years at ~500
  bytes per link), labels inputs given or assumed, picks an ID scheme and handles collisions, and
  has trade-off triggers at loads the estimation says are plausible.
